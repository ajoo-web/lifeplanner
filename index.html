<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Life Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Georgia,sans-serif;background:#f5f0e8;color:#0d2340;min-height:100vh}

/* TAB BAR */
.tab-bar{background:#f5f0e8;border-bottom:2px solid #d5ceeb;padding:10px 16px 0 16px;position:sticky;top:0;z-index:100}
.tab-bar-inner{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.tab-btn{border:none;border-radius:12px 12px 0 0;padding:7px 14px;cursor:pointer;font-size:.78rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;transition:all .18s;white-space:nowrap;line-height:1.2;background:#e8e4f4;color:#7b6faa;border-bottom:2px solid #d5ceeb}
.tab-btn:hover{background:#d5ceeb;color:#1a3a6b;transform:translateY(-2px)}
.tab-btn.active{background:#4aabf7;color:#fff;border-color:#4aabf7;transform:translateY(-1px);box-shadow:0 -2px 8px rgba(74,171,247,.25)}
.tab-home{background:#1a3a6b;color:#e0f2f6;font-size:.8rem;padding:8px 16px}
.tab-home:hover{background:#2d5a9e;color:#fff}
.tab-home.active{background:#4aabf7;color:#fff}
.tab-year{background:#f0e6a0;color:#8a7000;font-weight:800;font-size:.85rem;min-width:52px;cursor:pointer}
.tab-year:hover{background:#e8d060;color:#5a4a00;transform:translateY(-2px)}
.tab-month{min-width:42px;text-align:center}
.tab-archive{background:#e8e4f4;color:#7b6faa;font-size:1rem;padding:7px 10px}
.tab-archive.active{background:#87dbfd;color:#1a3a6b}
.tab-divider{width:1px;background:#d5ceeb;height:28px;margin:0 2px;align-self:center}
@media(max-width:700px){.tab-btn{padding:5px 8px;font-size:.7rem}.tab-home{padding:6px 10px}}

/* MAIN LAYOUT */
.main-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;max-width:1200px;margin:0 auto;padding:20px}
.pages-area{flex:1;min-width:300px}
.page{display:none}
.page.active{display:block}
#page-calendar.active{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
#page-archive.active{display:block}
.cal-wrapper{flex:1;min-width:300px}

/* Hide todo on archive */
.archive-visible .todo-panel{display:none}
@media(max-width:700px){
  .cal-wrapper{width:100%;min-width:unset}
  .right-col{flex-basis:100% !important;width:100% !important;flex-direction:row !important;flex-wrap:wrap}
  .todo-panel{flex:1;min-width:200px}
  .weight-panel{flex:1;min-width:200px;display:flex;flex-direction:column;}
}

/* CALENDAR */

.cal-nav h2{font-size:1.3rem;font-weight:800;min-width:200px;text-align:center;color:#1a3a6b;text-transform:uppercase;letter-spacing:.5px}
.cal-nav button{background:#fff;border:2px solid #87dbfd;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem;color:#1a3a6b;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cal-nav button:hover{background:#4aabf7;color:#fff;border-color:#4aabf7}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1.5px solid #d5ceeb;border-top:1.5px solid #d5ceeb}
.cal-dow{text-align:center;font-size:.68rem;font-weight:800;color:#86b1df;padding:5px 0;text-transform:uppercase;letter-spacing:.5px;border-right:1.5px solid #d5ceeb;border-bottom:1.5px solid #d5ceeb;background:#f5f0e8}

/* Week row wrapper for spanning events */
.week-row{display:contents}

.cal-cell{background:#fff;border-right:1.5px solid #d5ceeb;border-bottom:1.5px solid #d5ceeb;min-height:90px;padding:5px 5px 22px 5px;position:relative;cursor:pointer;transition:background .15s;}
.cal-cell:hover{background:#f0f8ff}
.cal-cell.empty{background:#f9f6f0;cursor:default}
.cal-cell.empty:hover{background:#f9f6f0}
.cal-cell.today{background:#e0f2f6}
.cal-cell.past{position:relative}
.cal-cell.past::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(
  to bottom right,
  transparent 0,transparent calc(50% - 1.5px),
  rgba(134,177,223,.65) calc(50% - 1.5px),rgba(134,177,223,.65) calc(50% + 1.5px),
  transparent calc(50% + 1.5px));pointer-events:none;z-index:1}
.day-num{font-size:1rem;font-weight:700;display:block;text-align:left;line-height:1;margin-bottom:2px;color:#1a3a6b}
.cal-cell.today .day-num{color:#0d6eb5;font-weight:800}
.cal-cell.past .day-num{color:#86b1df}
.holiday-lbl{font-size:.58rem;font-weight:800;color:#1a3a6b;text-align:center;display:block;margin-bottom:2px;line-height:1.2;letter-spacing:.2px}
.add-btn{position:absolute;bottom:2px;right:4px;font-size:.85rem;color:#87dbfd;background:none;border:none;cursor:pointer;z-index:2;padding:0;font-weight:700;line-height:1}
.add-btn:hover{color:#4aabf7}
.day-log-btn{position:absolute;bottom:3px;left:4px;font-size:1rem;background:none;border:none;cursor:pointer;z-index:3;padding:0;line-height:1;user-select:none;transition:transform .1s;}
.day-log-btn:hover{transform:scale(1.3);}
.health-subsection{margin-top:8px;border-top:1px solid #d5ceeb;padding-top:8px;}
.health-sub-title{font-size:.7rem;font-weight:800;color:#4aabf7;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.cycle-row{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:#1a3a6b;margin-bottom:3px;}
.cycle-val{font-weight:700;color:#1a3a6b;}
.cycle-days-till{text-align:center;margin-top:6px;font-size:.78rem;color:#e06090;font-weight:700;}

/* EVENT BARS in cells (single-day or first/mid/last of multi) */
.events-wrap{display:flex;flex-direction:column;gap:1px;position:relative;z-index:2}
.ev-tab{font-size:.72rem;font-weight:700;color:#fff;border-radius:20px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;max-width:100%;letter-spacing:.1px;margin-bottom:3px;height:20px;line-height:20px;display:block;box-sizing:border-box;}
/* Multi-day span styles */
.ev-tab.span-start{border-radius:20px 0 0 20px;}
.ev-tab.span-mid{border-radius:0;margin:0;padding-left:2px;padding-right:2px;opacity:.9}
.ev-tab.span-end{border-radius:0 20px 20px 0;}
.ev-tab.span-start.span-end{border-radius:20px;}

/* TODO PANEL */
.todo-panel{background:#fffde7;border:2px solid #e8e4b0;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(26,58,107,.08)}
.todo-panel h2{font-size:.85rem;font-weight:800;color:#1a3a6b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;border-bottom:2px solid #e8e4b0;padding-bottom:8px}
.todo-lines{display:flex;flex-direction:column;gap:0}
.todo-line{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #e8c84a;padding:7px 4px;min-height:36px}
.todo-line:first-child{border-top:1.5px solid #e8c84a}
.todo-cb{width:15px;height:15px;accent-color:#1a3a6b;cursor:pointer;flex-shrink:0}
.todo-input{flex:1;background:transparent;border:none;outline:none;font-size:.88rem;color:#0d2340;font-family:inherit;cursor:text;min-width:0}
.todo-input.done-text{text-decoration:line-through;color:#86b1df}

/* ARCHIVE */
.archive-section h2{font-size:1.1rem;font-weight:800;margin-bottom:14px;color:#1a3a6b;text-transform:uppercase;letter-spacing:.5px}
.arch-item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e8e4f4;border-radius:12px;padding:10px 14px;margin-bottom:7px;opacity:.75}
.arch-text{flex:1;font-size:.9rem;text-decoration:line-through;color:#86b1df}
.arch-date{font-size:.73rem;color:#d5ceeb;white-space:nowrap}
.btn-restore{background:none;border:2px solid #d5ceeb;border-radius:20px;cursor:pointer;font-size:.73rem;padding:3px 10px;color:#86b1df;transition:all .2s}
.btn-restore:hover{border-color:#4aabf7;color:#4aabf7}
.btn-clear{background:#c0392b;color:#fff;border:none;border-radius:20px;padding:7px 18px;cursor:pointer;font-size:.83rem;margin-bottom:14px;font-weight:700}
.empty-msg{color:#86b1df;font-size:.9rem;text-align:center;padding:20px 0;font-style:italic}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,35,64,.45);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:370px;max-width:95vw;box-shadow:0 12px 40px rgba(26,58,107,.2);border-top:4px solid #4aabf7}
.modal h3{margin-bottom:14px;font-size:1rem;font-weight:800;color:#1a3a6b;text-transform:uppercase;letter-spacing:.5px}
.modal label{font-size:.7rem;font-weight:800;display:block;margin-top:11px;margin-bottom:3px;color:#86b1df;text-transform:uppercase;letter-spacing:.5px}
.modal input{width:100%;border:2px solid #d5ceeb;border-radius:8px;padding:7px 10px;font-size:.88rem;background:#f5f0e8;color:#0d2340}
.modal input:focus{outline:none;border-color:#4aabf7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.btn-save{background:#1a3a6b;color:#fff;border:none;border-radius:20px;padding:8px 22px;cursor:pointer;font-size:.88rem;font-weight:700;transition:background .2s}
.btn-save:hover{background:#4aabf7}
.btn-cancel{background:transparent;color:#1a3a6b;border:2px solid #d5ceeb;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn-cancel:hover{border-color:#4aabf7;color:#4aabf7}
.btn-del{background:#c0392b;color:#fff;border:none;border-radius:20px;padding:8px 16px;cursor:pointer;font-size:.88rem;font-weight:700}
.swatches{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s}
.swatch:hover,.swatch.sel{transform:scale(1.3);border-color:#1a3a6b}

.yr-btn{background:#f5f0e8;border:1.5px solid #d5ceeb;border-radius:8px;padding:5px 4px;cursor:pointer;font-size:.8rem;font-weight:600;color:#1a3a6b;transition:all .15s;text-align:center}
.yr-btn:hover{background:#87dbfd;border-color:#4aabf7}
.yr-active{background:#4aabf7 !important;color:#fff !important;border-color:#4aabf7 !important}



/* WEEKLY PAGE */

.cal-nav-btn{background:#fff;border:2px solid #87dbfd;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1.1rem;color:#1a3a6b;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.cal-nav-btn:hover{background:#4aabf7;color:#fff;border-color:#4aabf7}



.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1.5px solid #d5ceeb;border-top:none;margin-bottom:0}
.wday-col{border-right:1.5px solid #d5ceeb;border-bottom:1.5px solid #d5ceeb;min-height:180px;display:flex;flex-direction:column;background:#fff;min-width:0;overflow:hidden}
.wday-col.wday-today{background:#e0f2f6}
.wday-head{padding:6px 7px 4px;border-bottom:1.5px solid #d5ceeb;background:#f5f0e8}
.wday-dow{font-size:.65rem;font-weight:800;color:#86b1df;text-transform:uppercase;letter-spacing:.5px}
.wday-date{font-size:1rem;font-weight:800;color:#1a3a6b;line-height:1}
.wday-col.wday-today .wday-date{color:#4aabf7}
.weather-btn{font-size:1.3rem;cursor:pointer;background:none;border:none;padding:2px;border-radius:6px;transition:transform .15s;display:block;margin:0 auto 2px}
.weather-btn:hover{transform:scale(1.25)}
.wday-events{padding:4px 5px 4px 5px;display:flex;flex-direction:column;flex:1}
.wday-sep{border:none;border-top:1.5px dashed #d5ceeb;margin:4px 5px}
.wday-week-events{padding:2px 5px;display:flex;flex-direction:column;gap:2px}
.wday-add{background:none;border:none;cursor:pointer;color:#87dbfd;font-size:.8rem;font-weight:800;padding:3px 5px;text-align:left;width:100%;transition:color .15s}
.wday-add:hover{color:#4aabf7}
.wev-tab{font-size:.62rem;font-weight:700;color:#fff;border-radius:20px;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wev-tab.week-only{opacity:.85}

/* HABIT TRACKER */
.habit-section{border:1.5px solid #d5ceeb;border-radius:12px;overflow-x:auto;margin-top:0;background:#fff}
.habit-title{background:#1a3a6b;color:#e0f2f6;font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:6px 12px}
.habit-grid{display:grid}
.habit-row{display:grid;grid-template-columns:60px repeat(7,minmax(28px,1fr));border-bottom:1.5px solid #d5ceeb;min-width:0}
.habit-row:last-child{border-bottom:none}
.habit-label{padding:6px 6px;font-size:.7rem;font-weight:700;color:#1a3a6b;display:flex;align-items:center;gap:3px;background:#f5f0e8;border-right:1.5px solid #d5ceeb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-cell{display:flex;align-items:center;justify-content:center;border-right:1.5px solid #d5ceeb;padding:6px 0;cursor:pointer}
.habit-cell:last-child{border-right:none}
.habit-dot{width:18px;height:18px;border-radius:50%;border:2px solid #d5ceeb;background:#f5f0e8;transition:all .18s;cursor:pointer}
.habit-dot.filled{border-color:#4aabf7;background:#4aabf7}
.habit-dot:hover{border-color:#87dbfd;transform:scale(1.15)}
.habit-header-row{display:grid;grid-template-columns:60px repeat(7,minmax(28px,1fr));background:#e8f4fd;border-bottom:1.5px solid #d5ceeb;min-width:0}
.habit-day-head{font-size:.65rem;font-weight:800;color:#86b1df;text-align:center;padding:4px 0;border-right:1.5px solid #d5ceeb;text-transform:uppercase}
.habit-day-head:last-child{border-right:none}
.habit-day-head.hd-first{background:#f5f0e8;border-right:1.5px solid #d5ceeb}


/* WEATHER ROW */
.weather-row{display:flex;gap:1px;justify-content:center;flex-wrap:wrap;padding:3px 2px}
.weather-icon-btn{background:none;border:none;cursor:pointer;font-size:.95rem;padding:1px;filter:grayscale(100%) opacity(0.35);transition:filter .18s,transform .15s;line-height:1}
.weather-icon-btn:hover{filter:grayscale(0%) opacity(0.7);transform:scale(1.2)}
.weather-active{filter:grayscale(0%) opacity(1) !important;transform:scale(1.15)}

/* HABIT ICONS IN COLUMN */
.habit-icons-row{display:flex;flex-wrap:wrap;justify-content:center;padding:4px 2px 5px;gap:1px}
.habit-icon-btn{background:none;border:none;cursor:pointer;font-size:clamp(.65rem,2.5vw,1rem);filter:grayscale(100%) opacity(0.3);transition:filter .18s,transform .15s;padding:1px;line-height:1}
.habit-icon-btn:hover{filter:grayscale(30%) opacity(0.7);transform:scale(1.2)}
.habit-colored{filter:grayscale(0%) opacity(1) !important;transform:scale(1.1)}

/* MINI CALENDAR */
.mini-cal-wrap{flex-shrink:0;align-self:center;margin-left:auto;}
.mini-cal{background:transparent;border:none;padding:2px 0;font-size:.6rem;width:100%;}
.mc-month-lbl{font-size:.6rem;font-weight:800;color:#1a3a6b;text-align:center;margin-bottom:2px;letter-spacing:.5px}
.mc-row{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:1px;}
.mc-row-highlighted{background:#e0f2f6;border-radius:20px;outline:2px solid #4aabf7;outline-offset:-1px}
.mc-dow{text-align:center;font-size:.55rem;font-weight:800;color:#86b1df;padding:1px 0;}
.mc-day{text-align:center;padding:2px 0;border-radius:50%;font-size:.6rem;color:#1a3a6b;cursor:default;line-height:1.6;}
.mc-empty{visibility:hidden}
.mc-today{background:#4aabf7;color:#fff;border-radius:50%;font-weight:800}
.mc-in-week{font-weight:700;color:#0d6eb5}

/* Remove old habit section styles since now inline */
.habit-section{display:none}






.todo-done-row{opacity:.7}
.todo-input.done-text{text-decoration:line-through;color:#86b1df;pointer-events:none}
.todo-done-row .todo-cb{accent-color:#86b1df}


/* MULTI-DAY EVENT BARS */
.multi-spacer{height:20px;margin-bottom:2px;visibility:hidden;display:block;}
.multi-gap{height:4px;display:block;}
.ev-multiday{position:absolute;z-index:4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:0;height:20px;line-height:20px;display:flex;align-items:center;padding:0 6px;font-size:.72rem;font-weight:700;color:#fff;cursor:pointer;transition:opacity .15s;}
.ev-multiday.span-start{border-radius:20px 0 0 20px;padding-left:8px}
.ev-multiday.span-end{border-radius:0 20px 20px 0;padding-right:8px}
.ev-multiday.span-start.span-end{border-radius:20px;}









/* MINI CAL NAV */
.mini-cal-nav{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:2px}
.mc-nav-btn{background:none;border:none;cursor:pointer;color:#1a3a6b;font-size:1rem;font-weight:800;padding:0 4px;line-height:1;transition:color .15s}
.mc-nav-btn:hover{color:#4aabf7}
.mc-nav-title{font-size:.62rem;font-weight:800;color:#1a3a6b;letter-spacing:.5px;text-align:center;flex:1}

/* Hoverable week rows */
.mc-row:not(:first-child):hover{background:#e0f2f6;border-radius:20px;cursor:pointer}


/* UNIFIED 3-COL NAV */
.unified-nav{display:flex;align-items:center;margin-bottom:14px;gap:8px;min-height:168px}
.unav-left{display:flex;gap:6px;flex-shrink:0;min-width:80px}
.unav-center{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;flex:1;gap:6px}
.unav-right{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:170px}
.unav-title{font-size:1.3rem;font-weight:800;color:#1a3a6b;text-transform:uppercase;letter-spacing:1px;text-align:center;min-width:0;word-break:break-word}
h2.unav-title{margin:0;min-width:unset}

/* WEEK NUMBER ROW */
.week-num-row{margin-bottom:0;width:100%}
.week-num-badge{background:#4aabf7;color:#fff;font-size:.78rem;font-weight:800;border-radius:6px 6px 0 0;padding:5px 12px;letter-spacing:.5px;display:block;width:100%;text-align:left;box-sizing:border-box}


/* M/W TOGGLE SWITCH */
.mw-toggle{display:inline-flex;background:#e8e4f4;border-radius:20px;padding:2px;gap:0;border:1.5px solid #d5ceeb}
.mw-opt{padding:5px 12px;border-radius:18px;font-size:.78rem;font-weight:800;cursor:pointer;color:#7b6faa;transition:all .18s;user-select:none;letter-spacing:.3px}
.mw-opt:hover{color:#1a3a6b}
.mw-active{background:#1a3a6b;color:#fff !important;border-radius:18px}

/* Remove old vt-pill styles */


/* WEEKLY NOTES */
.week-notes-section{position:relative;}
.week-notes-label{font-size:.75rem;font-weight:800;color:#1a3a6b;margin-bottom:6px;letter-spacing:.4px}
.week-notes-section{position:relative}
.week-notes-textarea{
  width:100%;
  height:112px;
  min-height:60px;
  max-height:300px;
  border:1.5px solid #d5ceeb;
  border-radius:10px;
  padding:6px 12px 10px 14px;
  font-family:inherit;
  font-size:.85rem;
  color:#1a3a6b;
  line-height:1.6;
  background-color:#f5f0e8;
  background-image:none;
  resize:vertical;
  box-sizing:border-box;
  outline:none;
  transition:border-color .2s;
  overflow-y:auto;
  vertical-align:bottom;
}
.week-notes-textarea:focus{border-color:#4aabf7}

/* PHOTO STACK */
.photo-carousel-section{margin-top:10px;}
.photo-carousel-label{font-size:.75rem;font-weight:800;color:#1a3a6b;margin-bottom:8px;letter-spacing:.4px;display:flex;align-items:center;justify-content:space-between;}
.pc-add-btn{background:#4aabf7;color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:.72rem;font-weight:800;cursor:pointer;letter-spacing:.3px;}
.pc-add-btn:hover{background:#1a3a6b;}
.pc-card{position:relative;width:150px;height:150px;border-radius:10px;overflow:hidden;border:2.5px solid #d5ceeb;background:#e8e4f4;box-shadow:0 2px 8px rgba(26,58,107,.13);display:inline-block;flex-shrink:0;}
.pc-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.pc-card-del{position:absolute;top:4px;right:4px;background:rgba(192,57,43,.88);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;line-height:1;font-weight:800;}
.pc-card-del:hover{background:#c0392b;}
.pc-card-num{position:absolute;bottom:4px;left:6px;background:rgba(26,58,107,.65);color:#fff;font-size:.55rem;font-weight:800;border-radius:6px;padding:1px 5px;}

}

.wday-add:hover{color:#4aabf7;}
.wday-inline-input{
  width:100%;box-sizing:border-box;

<script>
var COLORS = ['#1a3a6b','#4aabf7','#87dbfd','#7b6faa','#e53935','#fb8c00','#43a047','#0d6eb5','#f06292'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var HOLIDAYS = {
  '01-01':"New Year's Day",'01-19':"MLK Day",'02-17':"Presidents' Day",
  '05-26':"Memorial Day",'06-19':"Juneteenth",'07-04':"Independence Day",
  '09-01':"Labor Day",'10-13':"Columbus Day",'11-11':"Veterans Day",
  '11-27':"Thanksgiving",'12-25':"Christmas",'12-31':"New Year's Eve"
};
var TODO_COUNT = 7;

var curYear = 0, curMonth = 0;
var pickedColor = COLORS[0];
var editingId = null, detailId = null;

function loadData(key,def){try{return JSON.parse(localStorage.getItem(key)||'null')||def;}catch(e){return def;}}
var events  = loadData('lp_ev',[]);
var todos   = loadData('lp_td2',[]);  // fresh key for new format
var archive = loadData('lp_ar',[]);

// Ensure todos array always has exactly 7 slots
function normalizeTodos(){
  while(todos.length < TODO_COUNT) todos.push({id:'td_'+Date.now()+'_'+todos.length, text:'', done:false});
}
normalizeTodos();

function save(){
  localStorage.setItem('lp_ev',JSON.stringify(events));
  localStorage.setItem('lp_td2',JSON.stringify(todos));
  localStorage.setItem('lp_ar',JSON.stringify(archive));
}

/* ---- NAV ---- */
function showPage(name,btn){
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
  clearTabActive();
  document.getElementById('page-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='archive'){ renderArchive(); showTodo(false); showWeightTracker(false); }
  else if(name==='search'){ showTodo(false); showWeightTracker(false); document.getElementById('searchInput').focus(); runSearch(); }
  else{ showTodo(true); showWeightTracker(false); }
}

/* ---- CALENDAR ---- */
function initCalendar(){
  var now=new Date();
  curYear=now.getFullYear();
  curMonth=now.getMonth();
  document.getElementById('tab-year').textContent=curYear;
  highlightMonthTab(curMonth);
  renderCalendar();
}

function goHome(btn){
  var now=new Date();
  curYear=now.getFullYear();
  curMonth=now.getMonth();
  // Ensure month mode is active
  document.querySelectorAll('.mw-opt').forEach(function(b){ b.classList.remove('mw-active'); });
  document.querySelectorAll('[id^="vt-month"]').forEach(function(b){ b.classList.add('mw-active'); });
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
  document.getElementById('page-calendar').classList.add('active');
  clearTabActive();
  document.getElementById('tab-home').classList.add('active');
  document.getElementById('tab-year').textContent=curYear;
  highlightMonthTab(curMonth);
  renderCalendar();
  showTodo(true);
  showWeightTracker(false);
}

function goMonth(m, btn){
  var inWeekMode = document.getElementById('page-week').classList.contains('active');
  clearTabActive();
  document.getElementById('tab-home').classList.add('active');
  highlightMonthTab(m);
  if(inWeekMode){
    var now=new Date();
    curMonth = m;
    if(m===now.getMonth() && curYear===now.getFullYear()){
      curWeekStart=getWeekStart(now);
      miniCalYear=null; miniCalMonth=null;
    } else {
      curWeekStart=getWeekStart(new Date(curYear, m, 1));
      miniCalYear=curYear; miniCalMonth=m;
    }
    renderWeek();
  } else {
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
    document.getElementById('page-calendar').classList.add('active');
    document.querySelectorAll('.mw-opt').forEach(function(b){ b.classList.remove('mw-active'); });
    document.querySelectorAll('[id^="vt-month"]').forEach(function(b){ b.classList.add('mw-active'); });
    curMonth=m;
    renderCalendar();
    showWeightTracker(false);
    showTodo(true);
  }
}

function clearTabActive(){
  var btns=document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
}

function highlightMonthTab(m){
  var ids=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  // Clear all month tabs first
  for(var i=0;i<ids.length;i++){
    var t=document.getElementById('tab-'+ids[i]);
    if(t) t.classList.remove('active');
  }
  // Set the correct one
  var el=document.getElementById('tab-'+ids[m]);
  if(el) el.classList.add('active');
}

function changeMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderCalendar();
}

function pad2(n){return n<10?'0'+n:''+n;}
function mkDateStr(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d);}

function getEffectiveEvents(rangeStart,rangeEnd){
  var result=[];
  for(var i=0;i<events.length;i++){
    var ev=events[i];
    if(ev.recurYearly){
      var base=new Date(ev.startDate+'T00:00:00'),rs=new Date(rangeStart+'T00:00:00'),re=new Date(rangeEnd+'T00:00:00');
      for(var yr=rs.getFullYear();yr<=re.getFullYear();yr++){
        var d=new Date(yr,base.getMonth(),base.getDate());
        if(d>=rs&&d<=re){ var ds=d.toISOString().slice(0,10); var clone={}; for(var k in ev) clone[k]=ev[k]; clone.startDate=ds; clone.endDate=ds; clone.id=ev.id+'_'+ds; clone.name='🎂 '+ev.name; result.push(clone); }
      }
    } else if(!ev.recurEvery){
      var evEnd=ev.endDate||ev.startDate;
      if(ev.startDate<=rangeEnd&&evEnd>=rangeStart) result.push(ev);
    } else {
      var interval=ev.recurEvery*7,base=new Date(ev.startDate+'T00:00:00');
      var rEnd=(ev.recurEndsType==='on'&&ev.recurEndsOn)?new Date(ev.recurEndsOn+'T00:00:00'):new Date('2099-12-31');
      var rs=new Date(rangeStart+'T00:00:00'),re=new Date(rangeEnd+'T00:00:00'),d=new Date(base);
      while(d<=re){ if(d>=rs&&d<=rEnd){ var ds=d.toISOString().slice(0,10); var clone={}; for(var k in ev) clone[k]=ev[k]; clone.startDate=ds; clone.endDate=ds; clone.id=ev.id+'_'+ds; result.push(clone); } d.setDate(d.getDate()+interval); if(d>rEnd) break; }
    }
  }
  return result;
}

function renderCalendar(){
  document.getElementById('calTitle').textContent=MONTHS[curMonth]+' '+curYear;
  document.getElementById('tab-year').textContent=curYear;
  highlightMonthTab(curMonth);
  var grid=document.getElementById('calGrid');
  grid.innerHTML='';

  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(var i=0;i<7;i++){
    var h=document.createElement('div');
    h.className='cal-dow';
    h.textContent=days[i];
    grid.appendChild(h);
  }

  var today=new Date();
  var todayStr=mkDateStr(today.getFullYear(),today.getMonth(),today.getDate());
  var firstDow=new Date(curYear,curMonth,1).getDay();
  var daysInMonth=new Date(curYear,curMonth+1,0).getDate();

  var cells=[];
  var prevMo=curMonth===0?11:curMonth-1;
  var prevYr=curMonth===0?curYear-1:curYear;
  var daysInPrevMonth=new Date(prevYr,prevMo+1,0).getDate();
  for(var e=0;e<firstDow;e++) cells.push('prev_'+(daysInPrevMonth-firstDow+1+e));
  for(var d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0){ cells.push(null); }

  var BAR_H=20, BAR_GAP=2, TOP_OFF=26;

  for(var w=0;w<cells.length/7;w++){
    var weekCells=cells.slice(w*7,(w+1)*7);
    var weekDates=[];
    for(var c=0;c<7;c++){
      var wc=weekCells[c];
      if(wc===null) weekDates.push(null);
      else if(typeof wc==='string'&&wc.indexOf('prev_')===0){
        var pd=parseInt(wc.replace('prev_',''));
        var pm=curMonth===0?11:curMonth-1, py=curMonth===0?curYear-1:curYear;
        weekDates.push(mkDateStr(py,pm,pd));
      } else if(typeof wc==='string'&&wc.indexOf('next_')===0){
        var nd=parseInt(wc.replace('next_',''));
        var nm=(curMonth+1)%12, ny=curMonth===11?curYear+1:curYear;
        weekDates.push(mkDateStr(ny,nm,nd));
      } else weekDates.push(mkDateStr(curYear,curMonth,wc));
    }
    var weekStart=null, weekEnd=null;
    for(var c=0;c<7;c++){if(weekDates[c]){if(!weekStart)weekStart=weekDates[c];weekEnd=weekDates[c];}}

    // Week row container
    var weekRow=document.createElement('div');
    weekRow.className='cal-week-row';
    weekRow.style.gridColumn='1 / 8';

    var cellGrid=document.createElement('div');
    cellGrid.className='cal-week-cells';
    var dayCellEls=[];

    for(var c=0;c<7;c++){
      var cell=document.createElement('div');
      if(weekCells[c]===null){
        cell.className='cal-cell empty';
      } else if(typeof weekCells[c]==='string'&&weekCells[c].indexOf('prev_')===0){
        var prevDay=parseInt(weekCells[c].replace('prev_',''));
        var prevMo2=curMonth===0?11:curMonth-1;
        var prevYr2=curMonth===0?curYear-1:curYear;
        cell.className='cal-cell next-month';
        var numSpan=document.createElement('span');
        numSpan.className='day-num next-month-num';
        numSpan.textContent=prevDay;
        cell.appendChild(numSpan);
        (function(yr,mo,dy){
          cell.onclick=function(e){
            if(e.target.classList.contains('add-btn')||e.target.classList.contains('ev-tab')) return;
            curWeekStart=getWeekStart(new Date(yr,mo,dy));
            document.querySelectorAll('.mw-opt').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('[id^="vt-week"]').forEach(function(b){b.classList.add('mw-active');});
            document.querySelectorAll('[id^="vt-month"]').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
            document.getElementById('page-week').classList.add('active');
            miniCalYear=null; miniCalMonth=null;
            renderWeek(); showTodo(true); showWeightTracker(true);
          };
        })(prevYr2,prevMo2,prevDay);
      } else if(typeof weekCells[c]==='string'&&weekCells[c].indexOf('next_')===0){
        var nextDay=parseInt(weekCells[c].replace('next_',''));
        var nextMo=(curMonth+1)%12;
        var nextYr=curMonth===11?curYear+1:curYear;
        var nextDs=mkDateStr(nextYr,nextMo,nextDay);
        cell.className='cal-cell next-month';
        var numSpan=document.createElement('span');
        numSpan.className='day-num next-month-num';
        numSpan.textContent=nextDay;
        cell.appendChild(numSpan);
        // clicking navigates to that week
        (function(yr,mo,dy){
          cell.onclick=function(e){
            if(e.target.classList.contains('add-btn')||e.target.classList.contains('ev-tab')) return;
            curWeekStart=getWeekStart(new Date(yr,mo,dy));
            document.querySelectorAll('.mw-opt').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('[id^="vt-week"]').forEach(function(b){b.classList.add('mw-active');});
            document.querySelectorAll('[id^="vt-month"]').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
            document.getElementById('page-week').classList.add('active');
            miniCalYear=null; miniCalMonth=null;
            renderWeek(); showTodo(true); showWeightTracker(true);
          };
        })(nextYr,nextMo,nextDay);
      } else {
        var d=weekCells[c], ds=weekDates[c];
        cell.className='cal-cell';
        (function(dStr,yr,mo,dy){
          cell.onclick=function(e){
            if(e.target.classList.contains('add-btn')||e.target.classList.contains('ev-tab')||e.target.classList.contains('ev-multiday')) return;
            curWeekStart=getWeekStart(new Date(yr,mo,dy));
            // Switch to week view without switchView recalculating curWeekStart
            var isWeek=true;
            document.querySelectorAll('.mw-opt').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('[id^="vt-week"]').forEach(function(b){b.classList.add('mw-active');});
            document.querySelectorAll('[id^="vt-month"]').forEach(function(b){b.classList.remove('mw-active');});
            document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
            document.getElementById('page-week').classList.add('active');
            miniCalYear=null; miniCalMonth=null;
            renderWeek();
            showTodo(true);
            showWeightTracker(true);
          };
        })(ds,curYear,curMonth,d);
        var cellDate=new Date(curYear,curMonth,d);
        var todayDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
        if(ds===todayStr) cell.classList.add('today');
        else if(cellDate<todayDate) cell.classList.add('past');
        var mmdd=pad2(curMonth+1)+'-'+pad2(d);
        var holiday=HOLIDAYS[mmdd];
        if(holiday){var hl=document.createElement('span');hl.className='holiday-lbl';hl.textContent=holiday;cell.appendChild(hl);}
        var numSpan=document.createElement('span');
        numSpan.className='day-num';
        numSpan.textContent=d;
        cell.insertBefore(numSpan,cell.firstChild);
        (function(dStr){ var lb=document.createElement('button'); lb.className='day-log-btn'; lb.title='Log: cravings or period'; updateDayLogBtn(lb,dayLog[dStr]||'none'); lb.onclick=function(e){ e.stopPropagation(); cycleDayLog(dStr,lb); }; cell.appendChild(lb); })(ds);
        var wrap=document.createElement('div');
        wrap.className='events-wrap';
        wrap.id='ewrap_'+ds;
        cell.appendChild(wrap);
        (function(dStr){
          var ab=document.createElement('button');
          ab.className='add-btn';ab.textContent='+';ab.title='Add event';
          ab.onclick=function(e){e.stopPropagation();openAddModal(dStr);};
          cell.appendChild(ab);
        })(ds);
      }
      dayCellEls.push(cell);
      cellGrid.appendChild(cell);
    }
    weekRow.appendChild(cellGrid);

    // Overlay for multi-day bars
    var overlay=document.createElement('div');
    overlay.className='cal-week-overlay';
    weekRow.appendChild(overlay);
    grid.appendChild(weekRow);

    // Collect events for this week
    var weekEventsAll=[];
    if(weekStart&&weekEnd){
      var _cevs=getEffectiveEvents(weekStart,weekEnd);
      for(var ei=0;ei<_cevs.length;ei++) weekEventsAll.push(_cevs[ei]);
    }

    // Separate multi-day vs single-day
    var multiEvs=[], singleEvs=[];
    for(var ei=0;ei<weekEventsAll.length;ei++){
      var ev=weekEventsAll[ei];
      if(ev.endDate&&ev.endDate!==ev.startDate) multiEvs.push(ev);
      else singleEvs.push(ev);
    }

    // Lane assignment for multi-day events (greedy)
    var lanes=[]; // lanes[i] = endDate of last event in lane i
    var evLane=[];
    for(var mi=0;mi<multiEvs.length;mi++){
      var ev=multiEvs[mi];
      var evEnd=ev.endDate||ev.startDate;
      var lane=-1;
      for(var li=0;li<lanes.length;li++){
        if(ev.startDate>lanes[li]){lane=li;break;}
      }
      if(lane===-1){lane=lanes.length;lanes.push(null);}
      lanes[lane]=evEnd;
      evLane.push(lane);
    }
    var numLanes=lanes.length;

    // Add spacers to each covered cell for multi-day lanes
    // spacerCount[col] = number of multi-day lanes covering that column
    var spacerCount=[];
    for(var c=0;c<7;c++) spacerCount.push(0);
    for(var mi=0;mi<multiEvs.length;mi++){
      var ev=multiEvs[mi];
      var evEnd=ev.endDate||ev.startDate;
      for(var c=0;c<7;c++){
        if(weekDates[c]&&weekDates[c]>=ev.startDate&&weekDates[c]<=evEnd){
          spacerCount[c]=Math.max(spacerCount[c], evLane[mi]+1);
        }
      }
    }
    for(var c=0;c<7;c++){
      if(spacerCount[c]>0){
        var wrap=document.getElementById('ewrap_'+weekDates[c]);
        if(wrap){
          for(var li=0;li<spacerCount[c];li++){
            var sp=document.createElement('div');
            sp.className='multi-spacer';
            wrap.appendChild(sp);
          }
        }
      }
    }

    // Render multi-day bars in overlay at correct lane top
    for(var mi=0;mi<multiEvs.length;mi++){
      (function(ev,lane){
        var evEnd=ev.endDate||ev.startDate;
        var startCol=-1,endCol=-1;
        for(var c=0;c<7;c++){
          if(weekDates[c]&&weekDates[c]>=ev.startDate&&weekDates[c]<=evEnd){
            if(startCol===-1) startCol=c;
            endCol=c;
          }
        }
        if(startCol===-1) return;
        var isStart=(ev.startDate>=weekStart);
        var isEnd=(evEnd<=weekEnd);
        var bar=document.createElement('div');
        bar.className='ev-tab ev-multiday'+(isStart?' span-start':'')+(isEnd?' span-end':'');
        bar.style.background=ev.color||COLORS[0];
        bar.textContent=(ev.startTime?ev.startTime+' ':'')+ev.name;
        bar.style.left=(startCol/7*100)+'%';
        bar.style.width=((endCol-startCol+1)/7*100)+'%';
        bar.style.top=(lane*(BAR_H+BAR_GAP))+'px';
        bar.style.position='absolute';
        bar.style.boxSizing='border-box';
        bar.style.paddingRight='4px';
        bar.onclick=function(e){e.stopPropagation();openDetail(ev.id);};
        overlay.appendChild(bar);
      })(multiEvs[mi], evLane[mi]);
    }

    // Add a gap spacer after multi-spacers before single-day events
    for(var c=0;c<7;c++){
      if(spacerCount[c]>0 && weekDates[c]){
        var wrap=document.getElementById('ewrap_'+weekDates[c]);
        if(wrap){
          var gsp=document.createElement('div');
          gsp.className='multi-gap';
          wrap.appendChild(gsp);
        }

function fixMultidayBars(){
  var bars=document.querySelectorAll('.ev-multiday');
  bars.forEach(function(bar){
    var sc=parseInt(bar.getAttribute('data-sc'));
    var ec=parseInt(bar.getAttribute('data-ec'));
    var span=ec-sc+1;
    var wrap=bar.parentElement; // events-wrap inside startCol cell
    var cell=wrap.closest('.cal-cell');
    if(!cell) return;

    // Find the endCol cell by walking grid siblings
    var grid=cell.parentElement;
    var cells=Array.from(grid.children).filter(function(el){return el.classList.contains('cal-cell')||el.classList.contains('empty');});
    var cellIdx=cells.indexOf(cell);
    if(cellIdx===-1) return;
    var endCell=cells[cellIdx+(ec-sc)];
    if(!endCell) return;

    // Calculate pixel width from startCell left edge to endCell right edge
    var cellRect=cell.getBoundingClientRect();
    var endRect=endCell.getBoundingClientRect();
    var totalW=(endRect.right - cellRect.left) - 6; // 3px inset each side

    bar.style.position='absolute';
    bar.style.left='3px';
    bar.style.right='auto';
    bar.style.width=totalW+'px';
    bar.style.zIndex='4';
    bar.style.whiteSpace='nowrap';
    bar.style.overflow='hidden';
    bar.style.textOverflow='ellipsis';
    wrap.style.position='relative';
  });
}


/* ---- TODO (notepad style) ---- */
function renderTodo(){
  normalizeTodos();
  var container=document.getElementById('todoLines');
  container.innerHTML='';
  for(var i=0;i<TODO_COUNT;i++){
    (function(idx){
      var t=todos[idx];
      var isDone=t.done&&t.text;
      var row=document.createElement('div');
      row.className='todo-line'+(isDone?' todo-done-row':'');

      var cb=document.createElement('input');
      cb.type='checkbox';
      cb.className='todo-cb';
      cb.checked=!!isDone;
      cb.onchange=function(){
        if(!cb.checked && isDone){
          // Uncheck: restore to active
          todos[idx].done=false;
          todos[idx].doneDate=null;
          save(); renderTodo();
        } else {
          checkTodo(idx);
        }
      };

      var inp=document.createElement('input');
      inp.type='text';
      inp.className='todo-input'+(isDone?' done-text':'');
      inp.value=t.text||'';
      inp.placeholder='';
      inp.setAttribute('data-idx',idx);
      inp.readOnly=!!isDone; // can't edit a done item

      inp.oninput=function(){
        todos[idx].text=this.value;
        save();
      };
      inp.onkeydown=function(e){
        if(e.key==='Enter'){
          e.preventDefault();
          var next=document.querySelector('[data-idx="'+(idx+1)+'"]');
          if(next) next.focus();
        }
      };

      row.appendChild(cb);
      row.appendChild(inp);
      container.appendChild(row);
    })(i);
  }
}

function checkTodo(idx){
  var t=todos[idx];
  if(!t.text.trim()) return;
  // Mark done with today's date — archive at end of day
  todos[idx].done = true;
  todos[idx].doneDate = todayDateStr();
  save();
  renderTodo();
}

function todayDateStr(){
  var now=new Date();
  return now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
}

function archiveExpiredTodos(){
  var today=todayDateStr();
  var changed=false;
  var remaining=[];
  for(var i=0;i<todos.length;i++){
    if(todos[i].done && todos[i].doneDate && todos[i].doneDate < today){
      archive.push({id:todos[i].id, text:todos[i].text, archived:todos[i].doneDate});
      changed=true;
    } else {
      remaining.push(todos[i]);
    }
  }
  if(changed){
    todos=remaining;
    normalizeTodos();
    save();
    renderTodo();
  }
}

/* Crop state — offset is top-left of image in viewport px */
var _cSrc='', _cOx=0, _cOy=0, _cScale=1, _cNW=1, _cNH=1, _cVpW=280;
var _cDrag=false, _cLx=0, _cLy=0;

function openCropModal(src){
  _cSrc=src;
  var overlay=document.getElementById('cropOverlay');
  var img=document.getElementById('cropImg');
  overlay.classList.add('open');
  img.onload=function(){
    _cNW=img.naturalWidth; _cNH=img.naturalHeight;
    var vp=document.getElementById('cropViewport');
    _cVpW=vp.offsetWidth||280;
    /* scale so the SHORT side fills the viewport */
    _cScale=_cVpW/Math.min(_cNW,_cNH);
    /* clamp min so image always covers */
    var minS=_cVpW/Math.min(_cNW,_cNH);
    var sl=document.getElementById('cropZoom');
    sl.min=minS; sl.max=minS*4; sl.step=minS*0.01; sl.value=_cScale;
    /* center */
    _cOx=(_cVpW-_cNW*_cScale)/2;
    _cOy=(_cVpW-_cNH*_cScale)/2;
    _cropClamp();
    _cropDraw();
  };
  img.src=src;
  _cropBindEvents();
}
function closeCropModal(){ document.getElementById('cropOverlay').classList.remove('open'); }

function _cropClamp(){
  var iw=_cNW*_cScale, ih=_cNH*_cScale;
  /* don't let image edge go inside viewport leaving black */
  if(iw>=_cVpW){ _cOx=Math.min(0,Math.max(_cVpW-iw,_cOx)); }
  else { _cOx=(_cVpW-iw)/2; }
  if(ih>=_cVpW){ _cOy=Math.min(0,Math.max(_cVpW-ih,_cOy)); }
  else { _cOy=(_cVpW-ih)/2; }
}
function _cropDraw(){
  var img=document.getElementById('cropImg');
  img.style.left=_cOx+'px'; img.style.top=_cOy+'px';
  img.style.width=(_cNW*_cScale)+'px'; img.style.height=(_cNH*_cScale)+'px';
}
function cropApplyZoom(){
  var sl=document.getElementById('cropZoom');
  var newS=parseFloat(sl.value);
  /* zoom toward center of viewport */
  var cx=_cVpW/2, cy=_cVpW/2;
  _cOx=cx-(newS/_cScale)*(cx-_cOx);
  _cOy=cy-(newS/_cScale)*(cy-_cOy);
  _cScale=newS;
  _cropClamp(); _cropDraw();
}
function _cropBindEvents(){
  var vp=document.getElementById('cropViewport');
  /* remove old handlers by cloning */
  var vp2=vp.cloneNode(true);
  vp.parentNode.replaceChild(vp2,vp);
  vp2.addEventListener('mousedown',function(e){ _cDrag=true; _cLx=e.clientX; _cLy=e.clientY; e.preventDefault(); });
  document.addEventListener('mousemove',function(e){ if(!_cDrag) return; _cOx+=e.clientX-_cLx; _cOy+=e.clientY-_cLy; _cLx=e.clientX; _cLy=e.clientY; _cropClamp(); _cropDraw(); });
  document.addEventListener('mouseup',function(){ _cDrag=false; });
  vp2.addEventListener('touchstart',function(e){ _cLx=e.touches[0].clientX; _cLy=e.touches[0].clientY; e.preventDefault(); },{passive:false});
  vp2.addEventListener('touchmove',function(e){ _cOx+=e.touches[0].clientX-_cLx; _cOy+=e.touches[0].clientY-_cLy; _cLx=e.touches[0].clientX; _cLy=e.touches[0].clientY; _cropClamp(); _cropDraw(); e.preventDefault(); },{passive:false});
}

function cropConfirm(){
  /* 
   * The viewport shows a _cVpW x _cVpW window.
   * The image's top-left is at (_cOx, _cOy) in viewport px.
   * So the source rect in image-natural-px:
   *   srcX = -_cOx / _cScale
   *   srcY = -_cOy / _cScale
   *   srcW = _cVpW / _cScale
   *   srcH = _cVpW / _cScale
   */
  var OUT=400;
  var canvas=document.createElement('canvas'); canvas.width=OUT; canvas.height=OUT;
  var ctx=canvas.getContext('2d');
  var img=document.getElementById('cropImg');
  var srcX=-_cOx/_cScale;
  var srcY=-_cOy/_cScale;
  var srcS=_cVpW/_cScale;
  ctx.drawImage(img, srcX, srcY, srcS, srcS, 0, 0, OUT, OUT);
  var dataUrl=canvas.toDataURL('image/jpeg',0.88);
  loadPcData();
  var k=pcKey(); if(!pcData[k]) pcData[k]=[];
  pcData[k].push({id:'pc'+Date.now(),dataUrl:dataUrl});
  savePcData();
  closeCropModal();
  renderPhotoStack();
}

function getWeekStart(date){
  var d = new Date(date);
  d.setDate(d.getDate() - d.getDay()); // back to Sunday
  d.setHours(0,0,0,0);
  return d;
}

function getWeekNumber(date){
  var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function initWeek(){
  curWeekStart = getWeekStart(new Date());
  miniCalYear=null; miniCalMonth=null;
  renderWeek();
}

function changeWeek(d){
  curWeekStart = new Date(curWeekStart);
  curWeekStart.setDate(curWeekStart.getDate() + d*7);
  // Use the week's Sunday to determine displayed month/year for tab sync
  var sun = new Date(curWeekStart);
  curYear  = sun.getFullYear();
  curMonth = sun.getMonth();
  document.getElementById('tab-year').textContent = curYear;
  var byl=document.getElementById('budgetYearLabel'); if(byl) byl.textContent=curYear;
  miniCalYear = null; miniCalMonth = null;
  clearTabActive();
  document.getElementById('tab-home').classList.add('active');
  highlightMonthTab(curMonth);
  renderWeek();
}

function renderWeek(){
  var wn = getWeekNumber(curWeekStart);
  document.getElementById('weekNum').textContent = 'Week ' + wn;

  var endDate = new Date(curWeekStart); endDate.setDate(endDate.getDate()+6);
  var mo1=MONTHS[curWeekStart.getMonth()], mo2=MONTHS[endDate.getMonth()];
  var rangeStr = mo1.substring(0,3)+' '+curWeekStart.getDate();
  if(mo1!==mo2) rangeStr += ' \u2013 '+mo2.substring(0,3)+' '+endDate.getDate();
  else rangeStr += ' \u2013 '+endDate.getDate();
  document.getElementById('weekRange').textContent = rangeStr;
  renderMiniCal();

  var grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  var today = new Date(); today.setHours(0,0,0,0);
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var BAR_H=20, BAR_GAP=2;

  var weekDates=[];
  for(var c=0;c<7;c++){
    var dd=new Date(curWeekStart); dd.setDate(dd.getDate()+c);
    weekDates.push(mkDateStr(dd.getFullYear(),dd.getMonth(),dd.getDate()));
  }
  var weekStart=weekDates[0], weekEnd=weekDates[6];

  var multiEvs=[], singleMap={};
  var _wevs=getEffectiveEvents(weekStart,weekEnd);
  for(var ei=0;ei<_wevs.length;ei++){
    var ev=_wevs[ei], evEnd=ev.endDate||ev.startDate;
    if(ev.startDate>weekEnd||evEnd<weekStart) continue;
    if(ev.endDate&&ev.endDate!==ev.startDate) multiEvs.push(ev);
    else{ if(!singleMap[ev.startDate]) singleMap[ev.startDate]=[]; singleMap[ev.startDate].push(ev); }
  }

  var lanes=[], evLane=[];
  for(var mi=0;mi<multiEvs.length;mi++){
    var ev=multiEvs[mi], evEnd=ev.endDate||ev.startDate, lane=-1;
    for(var li=0;li<lanes.length;li++){if(ev.startDate>lanes[li]){lane=li;break;}}
    if(lane===-1){lane=lanes.length;lanes.push(null);}
    lanes[lane]=evEnd; evLane.push(lane);
  }
  var numLanes=lanes.length;

  var spacerCount=[];
  for(var c=0;c<7;c++) spacerCount.push(0);
  for(var mi=0;mi<multiEvs.length;mi++){
    var ev=multiEvs[mi], evEnd=ev.endDate||ev.startDate;
    for(var c=0;c<7;c++){
      if(weekDates[c]>=ev.startDate&&weekDates[c]<=evEnd)
        spacerCount[c]=Math.max(spacerCount[c],evLane[mi]+1);
    }
  }

  // ROW 1: Header cells (7 individual cells)
  for(var c=0;c<7;c++){
    (function(col){
      var d=new Date(curWeekStart); d.setDate(d.getDate()+col);
      var ds=weekDates[col];
      var isToday=d.getTime()===today.getTime();
      var hCell=document.createElement('div');
      hCell.className='wday-head-cell'+(isToday?' wday-today':'');
      var head=document.createElement('div'); head.className='wday-head';
      var dow=document.createElement('div'); dow.className='wday-dow'; dow.textContent=days[col];
      var dateNum=document.createElement('div'); dateNum.className='wday-date';
      dateNum.textContent=d.getDate()+(col===0?' '+MONTHS[d.getMonth()].substring(0,3):'');
      head.appendChild(dow); head.appendChild(dateNum);
      var wRow=document.createElement('div'); wRow.className='weather-row';
      for(var wi=0;wi<WEATHER_ICONS.length;wi++){
        (function(wii){
          var wBtn=document.createElement('button'); wBtn.className='weather-icon-btn';
          wBtn.textContent=WEATHER_ICONS[wii];
          if(weatherData[ds]!==undefined&&weatherData[ds]===wii) wBtn.classList.add('weather-active');
          wBtn.title=WEATHER_LABELS[wii];
          wBtn.onclick=(function(dStr,idx,rowEl){
            return function(){
              var prev=weatherData[dStr];
              if(prev===idx){delete weatherData[dStr];}else{weatherData[dStr]=idx;}
              var ab=rowEl.querySelectorAll('.weather-icon-btn');
              for(var k=0;k<ab.length;k++) ab[k].classList.toggle('weather-active',weatherData[dStr]===k);
              saveWeek();
            };
          })(ds,wii,wRow);
          wRow.appendChild(wBtn);
        })(wi);
      }
      head.appendChild(wRow);
      hCell.appendChild(head);
      grid.appendChild(hCell);
    })(c);
  }

  // ROW 2: Multi-day overlay (single spanning row)
  if(numLanes>0){
    var overlayRow=document.createElement('div');
    overlayRow.className='wk-overlay-row';
    overlayRow.style.gridColumn='1 / 8';
    overlayRow.style.height=(numLanes*(BAR_H+BAR_GAP)+6)+'px';
    for(var c=0;c<7;c++){
      var slot=document.createElement('div'); slot.className='wk-md-slot'; overlayRow.appendChild(slot);
    }
    for(var mi=0;mi<multiEvs.length;mi++){
      (function(ev,lane){
        var evEnd=ev.endDate||ev.startDate, startCol=-1, endCol=-1;
        for(var c=0;c<7;c++){
          if(weekDates[c]>=ev.startDate&&weekDates[c]<=evEnd){if(startCol===-1)startCol=c;endCol=c;}
        }
        if(startCol===-1) return;
        var isStart=(ev.startDate>=weekStart), isEnd=(evEnd<=weekEnd);
        var bar=document.createElement('div');
        bar.className='ev-tab ev-multiday'+(isStart?' span-start':'')+(isEnd?' span-end':'');
        bar.style.background=ev.color||COLORS[0];
        var showName=isStart||(startCol===0&&!isStart);
        bar.textContent=showName?((ev.startTime?ev.startTime+' ':'')+ev.name):'';
        bar.style.left=(startCol/7*100)+'%'; bar.style.width=((endCol-startCol+1)/7*100)+'%';
        bar.style.top=(lane*(BAR_H+BAR_GAP)+2)+'px';
        bar.style.position='absolute'; bar.style.boxSizing='border-box';
        bar.style.paddingLeft='8px'; bar.style.paddingRight='4px';
        bar.onclick=function(e){e.stopPropagation();openDetail(ev.id);};
        overlayRow.appendChild(bar);
      })(multiEvs[mi],evLane[mi]);
    }
    grid.appendChild(overlayRow);
  }

  // ROW 3: Single-day events — single spanning row with internal sub-grid
  var row3=document.createElement('div');
  row3.className='wk-sub-row wk-row3';
  row3.style.gridColumn='1 / 8';
  for(var c=0;c<7;c++){
    (function(col){
      var ds=weekDates[col];
      var cell=document.createElement('div'); cell.className='wday-row3-cell';
      // Spacers for multi-day lanes
      for(var li=0;li<spacerCount[col];li++){
        var sp=document.createElement('div'); sp.className='multi-spacer'; cell.appendChild(sp);
      }
      if(spacerCount[col]>0){var gsp=document.createElement('div');gsp.className='multi-gap';cell.appendChild(gsp);}
      var dayEvs=(singleMap[ds]||[]).slice().sort(function(a,b){
        if(!a.startTime&&!b.startTime) return 0;
        if(!a.startTime) return -1; if(!b.startTime) return 1;
        return a.startTime<b.startTime?-1:a.startTime>b.startTime?1:0;
      });
      for(var ei=0;ei<dayEvs.length;ei++){
        (function(evRef){
          var tab=document.createElement('div'); tab.className='ev-tab wday-ev-flush';
          tab.style.background=evRef.color||COLORS[0];
          tab.textContent=(evRef.startTime?evRef.startTime+' ':'')+evRef.name;
          tab.onclick=function(e){e.stopPropagation();openDetail(evRef.id);};
          cell.appendChild(tab);
        })(dayEvs[ei]);
      }
      row3.appendChild(cell);
    })(c);
  }
  grid.appendChild(row3);

  // ROW 4: Weekly events — single spanning row with internal sub-grid
  var row4=document.createElement('div');
  row4.className='wk-sub-row wk-row4';
  row4.style.gridColumn='1 / 8';
  for(var c=0;c<7;c++){
    (function(col){
      var ds=weekDates[col];
      var cell=document.createElement('div'); cell.className='wday-row4-cell';
      var wEvList=document.createElement('div'); wEvList.className='wday-wev-list';
      wEvList.id='wev-wrap-'+ds;
      function renderWevList(){
        wEvList.innerHTML='';
        var myEvs=weeklyEvents.filter(function(e){return e.date===ds;});
        for(var wi=0;wi<myEvs.length;wi++){
          (function(wevRef){
            var row=document.createElement('div'); row.className='wday-wev-row';
            var lbl=document.createElement('span'); lbl.className='wday-wev-lbl';
            lbl.contentEditable='true';
            lbl.spellcheck=false;
            lbl.textContent=(wevRef.time?wevRef.time+' ':'')+wevRef.name;
            lbl.onblur=(function(evRef){
              return function(){
                var newName=lbl.textContent.trim();
                if(newName){ evRef.name=newName; saveWeek(); }
                else{ lbl.textContent=(evRef.time?evRef.time+' ':'')+evRef.name; }
              };
            })(wevRef);
            lbl.onkeydown=function(e){
              if(e.key==='Enter'){e.preventDefault();lbl.blur();}
              if(e.key==='Escape'){lbl.textContent=(wevRef.time?wevRef.time+' ':'')+wevRef.name;lbl.blur();}
            };
            var trash=document.createElement('button'); trash.className='wday-wev-trash'; trash.innerHTML='&#128465;';
            trash.title='Delete';
            trash.onclick=(function(id,fn){
              return function(e){
                e.stopPropagation();
                weeklyEvents=weeklyEvents.filter(function(x){return x.id!==id;});
                saveWeek(); fn();
              };
            })(wevRef.id, renderWevList);
            row.appendChild(lbl); row.appendChild(trash);
            wEvList.appendChild(row);
          })(myEvs[wi]);
        }
      }
      renderWevList();
      cell.appendChild(wEvList);
      var addArea=document.createElement('div'); addArea.className='wday-add-area';
      var addBtn=document.createElement('button'); addBtn.className='wday-add'; addBtn.textContent='+ add';
      addBtn.onclick=(function(dStr,areaEl,renderFn){
        return function(){
          if(areaEl.querySelector('.wday-inline-input')) return;
          var inp=document.createElement('input'); inp.type='text'; inp.className='wday-inline-input';
          inp.placeholder='Event name...'; inp.maxLength=60;
          inp.onclick=function(e){e.stopPropagation();};
          inp.onkeydown=function(e){
            if(e.key==='Enter'){
              var name=inp.value.trim();
              if(name){
                var wev={id:'wev_'+Date.now(),name:name,date:dStr,time:null,color:COLORS[2]};
                weeklyEvents.push(wev); saveWeek(); renderFn();
              }
              areaEl.removeChild(inp);
            } else if(e.key==='Escape'){areaEl.removeChild(inp);}
          };
          inp.onblur=function(){setTimeout(function(){if(inp.parentElement)areaEl.removeChild(inp);},150);};
          areaEl.insertBefore(inp,addBtn); inp.focus();
        };
      })(ds,addArea,renderWevList);
      addArea.appendChild(addBtn);
      cell.appendChild(addArea);
      row4.appendChild(cell);
    })(c);
  }
  grid.appendChild(row4);

  // ROW 5: Habits — single spanning row with internal sub-grid
  var row5=document.createElement('div');
  row5.className='wk-sub-row wk-row5';
  row5.style.gridColumn='1 / 8';
  for(var c=0;c<7;c++){
    (function(col){
      var ds=weekDates[col];
      var cell=document.createElement('div'); cell.className='wday-row5-cell';
      var hRow=document.createElement('div'); hRow.className='habit-icons-row';
      for(var hi=0;hi<HABITS.length;hi++){
        (function(hIdx){
          var key=ds+'_'+hIdx;
          var hBtn=document.createElement('button');
          hBtn.className='habit-icon-btn'+(habitData[key]?' habit-colored':'');
          hBtn.textContent=HABITS[hIdx].icon; hBtn.title=HABITS[hIdx].label;
          hBtn.onclick=(function(k,b){
            return function(){habitData[k]=!habitData[k];b.classList.toggle('habit-colored',habitData[k]);saveWeek();};
          })(key,hBtn);
          hRow.appendChild(hBtn);
        })(hi);
      }
      cell.appendChild(hRow);
      (function(dStr){
        var logRow=document.createElement('div');
        logRow.style.cssText='display:flex;justify-content:center;align-items:center;width:100%;padding:3px 0 2px;border-top:1px solid #e8e2f5;margin-top:2px;';
        var wlb=document.createElement('button');
        wlb.style.cssText='font-size:1.1rem;background:none;border:none;cursor:pointer;padding:0;line-height:1;';
        wlb.title='Log: cravings or period';
        updateDayLogBtn(wlb,dayLog[dStr]||'none');
        wlb.onclick=function(e){ e.stopPropagation(); cycleDayLog(dStr,wlb); };
        logRow.appendChild(wlb);
        cell.appendChild(logRow);
      })(ds);
      row5.appendChild(cell);
    })(c);
  }
  grid.appendChild(row5);

  loadWeekNotes();
  renderPhotoStack();
  showWeightTracker(true);
  renderWeightTracker();
  renderBudget();
}


function renderHabitTracker(){
  var hGrid = document.getElementById('habitGrid');
  hGrid.innerHTML='';

  // Header row with day initials
  var headerRow = document.createElement('div'); headerRow.className='habit-header-row';
  var emptyHead = document.createElement('div'); emptyHead.className='habit-day-head hd-first';
  emptyHead.textContent='';
  headerRow.appendChild(emptyHead);
  var days=['S','M','T','W','T','F','S'];
  for(var c=0;c<7;c++){
    var d=new Date(curWeekStart); d.setDate(d.getDate()+c);
    var dh=document.createElement('div'); dh.className='habit-day-head';
    dh.textContent=days[c]+' '+d.getDate();
    headerRow.appendChild(dh);
  }
  hGrid.appendChild(headerRow);

  for(var hi=0;hi<HABITS.length;hi++){
    (function(hIdx){
      var row=document.createElement('div'); row.className='habit-row';
      var lbl=document.createElement('div'); lbl.className='habit-label';
      lbl.textContent=HABITS[hIdx].icon+' '+HABITS[hIdx].label;
      row.appendChild(lbl);
      for(var c=0;c<7;c++){
        (function(col){
          var d=new Date(curWeekStart); d.setDate(d.getDate()+col);
          var ds=mkDateStr(d.getFullYear(),d.getMonth(),d.getDate());
          var key=ds+'_'+hIdx;
          var cell=document.createElement('div'); cell.className='habit-cell';
          var dot=document.createElement('div');
          dot.className='habit-dot'+(habitData[key]?' filled':'');
          dot.onclick=function(){
            habitData[key]=!habitData[key];
            dot.classList.toggle('filled', habitData[key]);
            saveWeek();
          };
          cell.appendChild(dot); row.appendChild(cell);
        })(c);
      }
      hGrid.appendChild(row);
    })(hi);
  }
}

/* ---- WEEK-ONLY EVENTS ---- */
var editingWeekId=null, detailWeekId=null;

function openWeekAddModal(ds){
  editingWeekId=null;
  document.getElementById('wevName').value='';
  document.getElementById('wevDate').value=ds||'';
  document.getElementById('wevTime').value='';
  buildWeekSwatches(COLORS[2]);
  openOverlay('wevModal');
}

function openWeekEventDetail(id){
  detailWeekId=id;
  var wev=null;
  for(var i=0;i<weeklyEvents.length;i++){if(weeklyEvents[i].id===id){wev=weeklyEvents[i];break;}}
  if(!wev)return;
  document.getElementById('wevDName').textContent=wev.name;
  document.getElementById('wevDDate').textContent='📅 '+wev.date;
  document.getElementById('wevDTime').textContent=wev.time?('🕐 '+wev.time):'';
  openOverlay('wevDetailModal');
}

function saveWeekEvent(){
  var name=document.getElementById('wevName').value.trim();
  var date=document.getElementById('wevDate').value;
  if(!name||!date){alert('Name and date required.');return;}
  var wev={id:editingWeekId||('wev_'+Date.now()),name:name,date:date,time:document.getElementById('wevTime').value||null,color:pickedWeekColor};
  if(editingWeekId){for(var i=0;i<weeklyEvents.length;i++){if(weeklyEvents[i].id===editingWeekId){weeklyEvents[i]=wev;break;}}}
  else weeklyEvents.push(wev);
  saveWeek();renderWeek();closeOverlay('wevModal');
}

function openWeekEditFromDetail(){
  var wev=null;
  for(var i=0;i<weeklyEvents.length;i++){if(weeklyEvents[i].id===detailWeekId){wev=weeklyEvents[i];break;}}
  if(!wev)return;
  closeOverlay('wevDetailModal');
  editingWeekId=detailWeekId;
  document.getElementById('wevName').value=wev.name;
  document.getElementById('wevDate').value=wev.date;
  document.getElementById('wevTime').value=wev.time||'';
  buildWeekSwatches(wev.color||COLORS[2]);
  openOverlay('wevModal');
}

function deleteWeekEvent(){
  weeklyEvents=weeklyEvents.filter(function(e){return e.id!==detailWeekId;});
  saveWeek();renderWeek();closeOverlay('wevDetailModal');
}

var pickedWeekColor=COLORS[2];
function buildWeekSwatches(sel){
  pickedWeekColor=sel||COLORS[2];
  var c=document.getElementById('wevSwatches'); c.innerHTML='';
  for(var i=0;i<COLORS.length;i++){
    (function(col){
      var s=document.createElement('div'); s.className='swatch'+(col===pickedWeekColor?' sel':'');
      s.style.background=col;
      s.onclick=function(){buildWeekSwatches(col);};
      c.appendChild(s);
    })(COLORS[i]);
  }
}


var miniCalYear = null, miniCalMonth = null;

function miniCalChange(d){
  miniCalMonth += d;
  if(miniCalMonth < 0){ miniCalMonth = 11; miniCalYear--; }
  if(miniCalMonth > 11){ miniCalMonth = 0; miniCalYear++; }
  renderMiniCal();
}

function renderMiniCal(){
  var mc = document.getElementById('miniCal');
  if(!mc) return;
  mc.innerHTML='';

  // Init mini-cal to current week's month if not set
  if(miniCalYear===null){
    var thu = new Date(curWeekStart); thu.setDate(thu.getDate()+4);
    miniCalYear = thu.getFullYear(); miniCalMonth = thu.getMonth();
  }
  var mcYear = miniCalYear, mcMonth = miniCalMonth;

  var titleEl = document.getElementById('miniCalTitle');
  if(titleEl) titleEl.textContent = MONTHS[mcMonth].substring(0,3).toUpperCase()+' '+mcYear;

  var firstDow = new Date(mcYear,mcMonth,1).getDay();
  var daysIn   = new Date(mcYear,mcMonth+1,0).getDate();
  var cells=[]; for(var i=0;i<firstDow;i++) cells.push(null);
  for(var d=1;d<=daysIn;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  var ws=new Date(curWeekStart); ws.setHours(0,0,0,0);
  var we=new Date(curWeekStart); we.setDate(we.getDate()+6); we.setHours(23,59,59);
  var today=new Date(); today.setHours(0,0,0,0);

  // Day-of-week headers
  var dowRow=document.createElement('div'); dowRow.className='mc-row';
  var dows=['S','M','T','W','T','F','S'];
  for(var i=0;i<7;i++){
    var dh=document.createElement('span'); dh.className='mc-dow'; dh.textContent=dows[i];
    dowRow.appendChild(dh);
  }
  mc.appendChild(dowRow);

  for(var r=0;r<cells.length/7;r++){
    var row=document.createElement('div'); row.className='mc-row';
    var weekHasDay=false;
    for(var c=0;c<7;c++){
      var day=cells[r*7+c];
      if(day){
        var dt=new Date(mcYear,mcMonth,day); dt.setHours(0,0,0,0);
        if(dt>=ws&&dt<=we) weekHasDay=true;
      }
    }
    if(weekHasDay) row.classList.add('mc-row-highlighted');
    (function(rowEl,rowIdx){
      var firstDay=null;
      for(var ci=0;ci<7;ci++){if(cells[rowIdx*7+ci]){firstDay=cells[rowIdx*7+ci];break;}}
      if(firstDay){
        rowEl.style.cursor='pointer';
        rowEl.onclick=function(){
          curWeekStart=getWeekStart(new Date(mcYear,mcMonth,firstDay));
          var sun=new Date(curWeekStart);
          curYear=sun.getFullYear(); curMonth=sun.getMonth();
          document.getElementById('tab-year').textContent=curYear;
          clearTabActive();
          document.getElementById('tab-home').classList.add('active');
          highlightMonthTab(curMonth);
          renderWeek();
        };
      }
    })(row,r);
    for(var c=0;c<7;c++){
      var day=cells[r*7+c];
      var sp=document.createElement('span');
      sp.className='mc-day'+(day?'':' mc-empty');
      if(day){
        sp.textContent=day;
        var dt=new Date(mcYear,mcMonth,day); dt.setHours(0,0,0,0);
        if(dt.getTime()===today.getTime()) sp.classList.add('mc-today');
        if(dt>=ws&&dt<=we) sp.classList.add('mc-in-week');
        (function(d2){
          sp.onclick=function(e){e.stopPropagation();
            curWeekStart=getWeekStart(new Date(mcYear,mcMonth,d2));
            var sun=new Date(curWeekStart);
            curYear=sun.getFullYear(); curMonth=sun.getMonth();
            document.getElementById('tab-year').textContent=curYear;
            clearTabActive();
            document.getElementById('tab-home').classList.add('active');
            highlightMonthTab(curMonth);
            renderWeek();
          };
          sp.style.cursor='pointer';
        })(day);
      }
      row.appendChild(sp);
    }
    mc.appendChild(row);
  }
}


function switchView(view, btn){
  // Sync M/W toggle across both navbars
  var isWeek=(view==='week');
  document.querySelectorAll('.mw-opt').forEach(function(b){ b.classList.remove('mw-active'); });
  document.querySelectorAll('[id^="vt-week"]').forEach(function(b){ b.classList.toggle('mw-active',isWeek); });
  document.querySelectorAll('[id^="vt-month"]').forEach(function(b){ b.classList.toggle('mw-active',!isWeek); });
  var pages=document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
  var now=new Date();
  var todayYear=now.getFullYear(), todayMonth=now.getMonth();
  if(view==='month'){
    // switching TO month: show month matching curWeekStart's month (if week was active)
    var wasWeek=document.getElementById('page-week').classList.contains('active');
    if(wasWeek && curWeekStart){
      var sun=new Date(curWeekStart);
      curYear=sun.getFullYear(); curMonth=sun.getMonth();
      document.getElementById('tab-year').textContent=curYear;
      highlightMonthTab(curMonth);
    }
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
    document.getElementById('page-calendar').classList.add('active');
    renderCalendar();
    showTodo(true);
    showWeightTracker(false);
  } else {
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++) pages[i].classList.remove('active');
    document.getElementById('page-week').classList.add('active');
    // If curMonth+curYear == today → show current week, else show first week of curMonth
    if(curYear===todayYear && curMonth===todayMonth){
      curWeekStart=getWeekStart(now);
      miniCalYear=null; miniCalMonth=null;
    } else {
      curWeekStart=getWeekStart(new Date(curYear,curMonth,1));
      miniCalYear=curYear; miniCalMonth=curMonth;
    }
    renderWeek();
    showTodo(true);
  }
}


/* ---- WEEKLY NOTES ---- */
var weekNotesData = loadData('lp_week_notes', {});

function getWeekKey(){
  if(!curWeekStart) return 'none';
  return curWeekStart.getFullYear()+'-'+pad2(curWeekStart.getMonth()+1)+'-'+pad2(curWeekStart.getDate());
}

function loadWeekNotes(){
  var ta=document.getElementById('weekNotesArea');
  if(ta) ta.value = weekNotesData[getWeekKey()]||'';
}

function saveWeekNotes(){
  var ta=document.getElementById('weekNotesArea');

/* ---- WEIGHT TRACKER ---- */
var weightData = loadData('lp_weight', {});  // key: weekKey, val: number

function showWeightTracker(show){
  var wt=document.getElementById('weightTracker');
  if(wt) wt.style.display=show?'block':'none';
}

function renderWeightTracker(){
  weightData = loadData('lp_weight', {});
  var wk=getWeekKey();
  var dateEl=document.getElementById('weightDate');
  var inp=document.getElementById('weightInput');
  if(!dateEl||!inp) return;
  if(curWeekStart){
    var d=new Date(curWeekStart);
    dateEl.textContent='Week of '+MONTHS[d.getMonth()].substring(0,3)+' '+d.getDate()+', '+d.getFullYear();
  }
  inp.value = weightData[wk]!==undefined ? weightData[wk] : '';
  calcWeight();
  renderCycleStats();
}



function calcWeight(){
  var inp = document.getElementById('weightInput');
  var delta = document.getElementById('weightDelta');
  if(!inp || !delta || !curWeekStart) return;

  // Save current value
  var val = inp.value !== '' ? parseFloat(inp.value) : NaN;
  if(!isNaN(val)){ weightData[getWeekKey()]=val; localStorage.setItem('lp_weight',JSON.stringify(weightData)); }
  else { delete weightData[getWeekKey()]; localStorage.setItem('lp_weight',JSON.stringify(weightData)); }

  // Get prev week weight
  var prevStart=new Date(curWeekStart); prevStart.setDate(prevStart.getDate()-7);
  var prevKey=prevStart.getFullYear()+'-'+pad2(prevStart.getMonth()+1)+'-'+pad2(prevStart.getDate());
  var prevW=weightData[prevKey];

  if(inp.value==='' || isNaN(val)){
    delta.innerHTML = prevW!==undefined
      ? '<span style="color:#86b1df;font-size:.72rem">Last week: '+prevW+' lbs</span>'
      : '<span style="color:#d5ceeb;font-size:.72rem">--</span>';
    return;
  }

  if(prevW===undefined){
    delta.innerHTML='<span style="color:#d5ceeb;font-size:.72rem">--</span>';
    return;
  }

  var diff=(val - parseFloat(prevW)).toFixed(1);
  var n=parseFloat(diff);
  if(n===0)
    delta.innerHTML='<span style="color:#86b1df;font-weight:800">— no change</span>';
  else if(n>0)
    delta.innerHTML='<span class="wdelta-up">▲ +'+diff+' lbs</span>';
  else
    delta.innerHTML='<span class="wdelta-down">▼ '+diff+' lbs</span>';
}


function highlight(text, query){
  if(!query) return text;
  var re=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<span class="sr-highlight">$1</span>');
}

function runSearch(){
  var q=document.getElementById('searchInput').value.trim();
  var filter=document.getElementById('searchFilter').value;
  var res=document.getElementById('searchResults');
  res.innerHTML='';
  if(!q){ res.innerHTML='<div class="search-empty">Type to search events and notes.</div>'; return; }
  var ql=q.toLowerCase();
  var found=[];

  // Search calendar events
  if(filter==='all'||filter==='event'){
    for(var i=0;i<events.length;i++){
      var ev=events[i];
      if(ev.name.toLowerCase().indexOf(ql)!==-1){
        found.push({type:'Event',title:ev.name,date:ev.startDate+(ev.endDate&&ev.endDate!==ev.startDate?' → '+ev.endDate:''),color:ev.color,id:ev.id,kind:'event'});
      }
    }
    // Search weekly events
    for(var i=0;i<weeklyEvents.length;i++){
      var wev=weeklyEvents[i];
      if(wev.name.toLowerCase().indexOf(ql)!==-1){
        found.push({type:'Weekly Event',title:wev.name,date:wev.date,color:wev.color,id:wev.id,kind:'wevent'});
      }
    }
  }

  // Search week notes
  if(filter==='all'||filter==='note'){
    var noteData=loadData('lp_week_notes',{});
    for(var k in noteData){
      if(noteData[k]&&noteData[k].toLowerCase().indexOf(ql)!==-1){
        found.push({type:'Note',title:noteData[k].substring(0,80)+(noteData[k].length>80?'…':''),date:'Week of '+k,color:'#86b1df',id:k,kind:'note'});
      }
    }
  }

  if(!found.length){
    res.innerHTML='<div class="search-empty">No results for "'+q+'"</div>';
    return;
  }

  for(var i=0;i<found.length;i++){
    (function(item){
      var div=document.createElement('div'); div.className='search-result-item';
      var dot=item.color?'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+item.color+';margin-right:5px;vertical-align:middle;"></span>':'';
      div.innerHTML='<div class="sr-type">'+item.type+'</div>'
        +'<div class="sr-title">'+dot+highlight(item.title,q)+'</div>'
        +'<div class="sr-date">'+item.date+'</div>';
      if(item.kind==='event'){
        div.onclick=function(){ openDetail(item.id); };
      }
      res.appendChild(div);
    })(found[i]);
  }
}


/* ---- BUDGET ---- */
var budgetEntries = [];
  loadDayLog();

function budgetKey(){ return 'lp_budget_' + curYear; }
function loadBudgetForYear(){ budgetEntries = loadData(budgetKey(), []); }
function saveBudget(){ localStorage.setItem(budgetKey(), JSON.stringify(budgetEntries)); }

var budgetSign = 1;

function toggleBudgetSign(){
  budgetSign = budgetSign===1 ? -1 : 1;
  var btn=document.getElementById('budgetToggle');
  if(budgetSign===1){ btn.textContent='+'; btn.className='budget-toggle budget-toggle-pos'; }
  else{ btn.textContent='−'; btn.className='budget-toggle budget-toggle-neg'; }
}

function addBudgetEntry(){
  var name = document.getElementById('budgetItemName').value.trim();
  var raw  = parseFloat(document.getElementById('budgetItemAmt').value);
  if(!name || isNaN(raw)) return;
  budgetEntries.unshift({id:'bgt_'+Date.now(), name:name, amt:budgetSign*Math.abs(raw)});
  saveBudget();
  document.getElementById('budgetItemName').value='';
  document.getElementById('budgetItemAmt').value='';
  renderBudget();
  setTimeout(function(){ document.getElementById('budgetItemName').focus(); }, 0);
}

function renderBudget(){
  loadBudgetForYear();
  var yl=document.getElementById('budgetYearLabel');
  if(yl) yl.textContent=curYear;
  var posList = document.getElementById('budgetPosList');
  var negList = document.getElementById('budgetNegList');
  if(!posList||!negList) return;
  posList.innerHTML=''; negList.innerHTML='';

  var posTotal=0, negTotal=0;
  var posEntries=budgetEntries.filter(function(e){return e.amt>=0;});
  var negEntries=budgetEntries.filter(function(e){return e.amt<0;});

  posEntries.forEach(function(e){
    posTotal+=e.amt;
    var row=document.createElement('div'); row.className='budget-entry';
    row.innerHTML='<span class="budget-entry-name" title="'+e.name+'">'+e.name+'</span>'
      +'<span class="budget-entry-amt">+$'+e.amt.toFixed(2)+'</span>'
      +'<button class="budget-entry-del" title="Remove" onclick="removeBudgetEntry(\''+e.id+'\')">✕</button>';
    posList.appendChild(row);
  });

  negEntries.forEach(function(e){
    negTotal+=e.amt;
    var row=document.createElement('div'); row.className='budget-entry';
    row.innerHTML='<span class="budget-entry-name" title="'+e.name+'">'+e.name+'</span>'
      +'<span class="budget-entry-amt">-$'+Math.abs(e.amt).toFixed(2)+'</span>'
      +'<button class="budget-entry-del" title="Remove" onclick="removeBudgetEntry(\''+e.id+'\')">✕</button>';
    negList.appendChild(row);
  });

  document.getElementById('budgetPosTotal').textContent='+$'+posTotal.toFixed(2);
  document.getElementById('budgetNegTotal').textContent='-$'+Math.abs(negTotal).toFixed(2);

  var net = posTotal + negTotal;
  var netEl = document.getElementById('budgetNet');
  netEl.textContent=(net>=0?'+':'')+('$'+Math.abs(net).toFixed(2));
  netEl.style.color = net>0?'#3db86b':net<0?'#e05555':'#86b1df';

  // Allow Enter key on amount input
  document.getElementById('budgetItemAmt').onkeydown=function(e){if(e.key==='Enter') addBudgetEntry();};
  document.getElementById('budgetItemName').onkeydown=function(e){if(e.key==='Enter') document.getElementById('budgetItemAmt').focus();};
}

function removeBudgetEntry(id){
  budgetEntries=budgetEntries.filter(function(e){return e.id!==id;});
  saveBudget();
  renderBudget();
}
